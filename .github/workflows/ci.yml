name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Must come before `npm ci`: Cypress downloads a ~250 MB binary in its
      # postinstall step, and a warm cache skips it entirely.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e

      # Only useful when something failed, so don't spend storage otherwise.
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/archive-lens/browser
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    # Pull requests get verified but never deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      # Deploys exactly the artifact that passed the tests, rather than
      # rebuilding and hoping it comes out the same.
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=archive-lens --branch=main
