<!--
  Archive Lens application shell.

  Landmark structure is deliberate: assistive-tech users navigate by landmark,
  so there must be exactly one <main>, and routed content must render inside it.
-->

<a href="#main-content" class="skip-link visually-hidden">Skip to main content</a>

<header class="site-header">
  <!--
    The site name links home, as people expect from a wordmark. No
    routerLinkActive here: "/" is a prefix of every route, so it would render
    as permanently active.
  -->
  <h1><a routerLink="/">Archive Lens</a></h1>

  <nav aria-label="Primary">
    <ul>
      <li>
        <a routerLink="/search" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Search</a
        >
      </li>
      <li>
        <a routerLink="/saved" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          Saved
          @if (savedCount() > 0) {
            <span class="badge">{{ savedCount() }}</span>
          }
        </a>
      </li>
    </ul>
  </nav>
</header>

<main #mainContent id="main-content" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <p>
    Data from the
    <a href="https://www.loc.gov/apis/" target="_blank" rel="noopener noreferrer"
      >Library of Congress public API</a
    >.
  </p>
</footer>
